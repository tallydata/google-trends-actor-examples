name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest nbformat
      - run: pytest compat
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/quickstart.ipynb', as_version=4))"
